# Applying this Blueprint changes infrastructure. Existing data must be backed up first.
# The paid plan is required for a persistent disk; this file alone does not purchase it.
services:
  - type: web
    name: for-pocket
    runtime: node
    repo: https://github.com/honru09/for-pocket
    branch: main
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build && npm test
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    disk:
      name: pocket-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_URL
        value: https://for-pocket.onrender.com
      - key: AUTH_MAX_AGE_SECONDS
        value: 86400
      - key: BOT_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
